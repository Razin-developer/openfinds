build:
  maxIssues: 0

style:
  MagicNumber:
    active: false
  ReturnCount:
    active: false
  ForbiddenComment:
    active: false
  MaxLineLength:
    active: false
  UseCheckOrError:
    active: false
  # Two break/continue in the UDP beacon receive retry loop is a deliberate,
  # readable control-flow choice for a small loop — not a real issue.
  LoopWithTooManyJumpStatements:
    active: false

complexity:
  LongMethod:
    active: false
  LongParameterList:
    active: false
  TooManyFunctions:
    active: false
  LargeClass:
    active: false
  CyclomaticComplexMethod:
    ignoreAnnotated: ['Composable']

naming:
  MatchingDeclarationName:
    active: false
  FunctionNaming:
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    active: false

comments:
  UndocumentedPublicClass:
    active: false
  UndocumentedPublicFunction:
    active: false
