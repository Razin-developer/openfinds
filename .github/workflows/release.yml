name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Prepare signing config if secrets are present
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > release.keystore
            printf 'storeFile=%s/release.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$GITHUB_WORKSPACE" "$RELEASE_STORE_PASSWORD" "$RELEASE_KEY_ALIAS" "$RELEASE_KEY_PASSWORD" > keystore.properties
            echo "Signing configured from repository secrets."
          else
            echo "No signing secrets found; building an unsigned release."
          fi

      - name: Unit tests
        run: ./gradlew test --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Build release APK and AAB
        run: ./gradlew :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Rename artifacts with version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p out
          # AGP names the APK app-release.apk when signed, app-release-unsigned.apk otherwise
          # (e.g. no RELEASE_KEYSTORE_BASE64 secret configured) — pick up whichever exists.
          APK_PATH=$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' | head -n 1)
          AAB_PATH=$(find app/build/outputs/bundle/release -maxdepth 1 -name '*.aab' | head -n 1)
          DEBUG_APK_PATH=$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' | head -n 1)
          cp "$APK_PATH" "out/OpenFind-${VERSION}.apk"
          cp "$AAB_PATH" "out/OpenFind-${VERSION}.aab"
          cp "$DEBUG_APK_PATH" "out/OpenFind-${VERSION}-debug.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: OpenFind ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            out/*.apk
            out/*.aab
