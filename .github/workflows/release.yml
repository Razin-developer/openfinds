name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode signing keystore
        if: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > release.keystore

      - name: Write keystore.properties
        if: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
        env:
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
        run: >
          printf 'storeFile=%s/release.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n'
          "$GITHUB_WORKSPACE" "$RELEASE_STORE_PASSWORD" "$RELEASE_KEY_ALIAS" "$RELEASE_KEY_PASSWORD"
          > keystore.properties

      - name: Unit tests
        run: ./gradlew test --stacktrace

      - name: Build release APK and AAB
        run: ./gradlew :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Rename artifacts with version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/OpenFind-${VERSION}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "out/OpenFind-${VERSION}.aab"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: OpenFind ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            out/*.apk
            out/*.aab
